name: Test map

# Builds the map test.yml picks tests from: every test of xgodev/jovee runs
# alone under coverage, and the map records which functions (file and lines)
# each one executed. Started by hand when the code moved enough that the
# selection drifts (`gh workflow run test-map.yml -R xgodev/jovee-release -f ref=<branch>`).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'xgodev/jovee branch, tag or commit to map'
        required: true
        default: 'develop'

concurrency:
  group: test-map
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    name: Map (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    # The instrumented test binaries of the whole workspace do not fit one
    # runner's disk: four runners each take every fourth crate.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      RUSTFLAGS: -C instrument-coverage
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Add swap for the build peak
        run: |
          sudo swapoff -a
          sudo fallocate -l 4G /ci-swapfile
          sudo chmod 600 /ci-swapfile
          sudo mkswap /ci-swapfile
          sudo swapon /ci-swapfile

      - uses: actions/checkout@v4
        with:
          repository: xgodev/jovee
          ssh-key: ${{ secrets.STUDIO_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}

      - name: Load the deploy keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEYS }}

      - name: Pull LFS objects except the plugin tree
        run: SSH_AUTH_SOCK= git lfs pull --exclude="plugins/source/**"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          APT="sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60"
          $APT update
          $APT install -y \
            libasound2-dev libudev-dev libdbus-1-dev pkg-config clang libclang-dev \
            libfontconfig1-dev libseat-dev \
            libxkbcommon-dev libinput-dev libgbm-dev \
            libjack-jackd2-dev gettext

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Compile the translation catalogs
        run: |
          for po in crates/rig-gui/translations/*/LC_MESSAGES/rig-gui.po; do
            msgfmt -o "${po%.po}.mo" "$po"
          done

      - name: Check out the test selector
        uses: actions/checkout@v4
        with:
          path: .ci-tools

      - name: Build the test selector
        # Not instrumented: it is the tool, not the code under test.
        env:
          RUSTFLAGS: ""
        run: cargo build --release --manifest-path .ci-tools/tools/ci-test-map/Cargo.toml --target-dir .ci-tools/target

      - name: Build and run every test of this shard alone
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          (while sleep 60; do
            echo "mem: $(free -m | awk 'NR>1{printf "%s used=%s free=%s; ", $1, $3, $4}') disk: $(df -h / | awk 'NR==2{print $4}')"
            if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 5 ]; then
              du -xh --max-depth=3 target 2>/dev/null | sort -rh | head -30
              pkill -9 cargo; pkill -9 rustc; pkill -9 ci-test-map; break
            fi
          done) &
          pkgs=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | sort | awk -v s=${{ matrix.shard }} '(NR-1)%4==s' | sed 's/^/-p /' | tr '\n' ' ')
          cargo nextest list $pkgs --message-format json > list.json
          mkdir -p part
          git rev-parse HEAD > part/sha
          .ci-tools/target/release/ci-test-map map-run --list list.json \
            --llvm-bin "$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin" \
            --root "$PWD" --out part/part-${{ matrix.shard }}.json --jobs 4 --exclude e2e_ui

      - uses: actions/upload-artifact@v4
        with:
          name: test-map-part-${{ matrix.shard }}
          path: |
            part/part-${{ matrix.shard }}.json
            part/sha
          retention-days: 3

  merge:
    name: Merge and store the map
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the test selector
        run: cargo build --release --manifest-path tools/ci-test-map/Cargo.toml

      - uses: actions/download-artifact@v4
        with:
          pattern: test-map-part-*
          path: parts
          merge-multiple: true

      - name: Merge the parts
        id: merge
        run: |
          sha=$(cat parts/sha)
          tools/ci-test-map/target/release/ci-test-map map-merge --sha "$sha" --out test-map.json parts/part-*.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # test.yml restores the newest cache whose key starts with test-map-.
      - uses: actions/cache/save@v4
        with:
          path: test-map.json
          key: test-map-${{ steps.merge.outputs.sha }}-${{ github.run_id }}
