name: Test

# Tests a ref of xgodev/jovee, started by hand
# (`gh workflow run test.yml -R xgodev/jovee-release -f ref=<branch> -f base=<commit>`;
# add `-f coverage=true` for the coverage report). Only the tests that run the
# changed lines run, from the map test-map.yml builds.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'xgodev/jovee branch, tag or commit to check'
        required: true
        default: 'develop'
      base:
        description: 'Commit before the changes under test: only the tests that run the lines they change run. Empty = the last commit of ref.'
        required: false
        default: ''
      coverage:
        description: 'Also build the instrumented coverage report (rebuilds the whole workspace)'
        type: boolean
        default: false

# One run per ref; cancel superseded runs.
concurrency:
  group: test-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build-free tests of the studio's own scripts.
  validate-static:
    name: Static Checks (whole repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xgodev/jovee
          ssh-key: ${{ secrets.STUDIO_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}
      # #974: nam-refresh uses this script to write develop.
      - name: Test the NeuralAmpModelerCore vendor script
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q scripts/test_nam_vendor.py
      - name: Test the pre-PR gate and its hook
        run: python3 -m pytest -q scripts/test_pre_pr_gate.py
      - name: Test the build lock and its hook
        run: python3 -m pytest -q scripts/test_cargo_locked.py
      - name: Test that the git libraries follow their branch
        run: python3 -m pytest -q scripts/test_git_dependencies.py

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    # A warning fails the job like an error: Linux-only warnings (a helper
    # left unused by a `cfg(not(all(target_os = "linux", feature = "jack")))`
    # test) never show up on the owner's Mac. Job-level, so rust-cache keys on it.
    # No debuginfo: with it the test binaries filled the runner's disk. Also
    # job-level: set per step, it rebuilt every cached dependency (the cache
    # held line-tables builds) and the build took 46 min on a full cache hit.
    env:
      RUSTFLAGS: -D warnings
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      # The debug test binaries of the whole workspace outgrow the runner's
      # free disk: lld then dies with SIGBUS (signal 7) while writing the
      # adapter-gui test binary. Drop the preinstalled toolchains this job
      # never uses before building.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      # The workspace build peaks above the runner's RAM while it compiles and
      # links the adapter crates; the runner then loses the job (exit 137/143,
      # "lost communication with the server"). A swap file on the freed disk
      # absorbs the peak instead of killing the job.
      - name: Add swap for the build peak
        run: |
          sudo swapoff -a
          # 4 GB: the build peaked at ~8.4 GB RAM and <1 GB swap, and every GB
          # here is a GB the target dir cannot use ("No space left on device").
          sudo fallocate -l 4G /ci-swapfile
          sudo chmod 600 /ci-swapfile
          sudo mkswap /ci-swapfile
          sudo swapon /ci-swapfile
          free -h

      - uses: actions/checkout@v4
        with:
          repository: xgodev/jovee
          ssh-key: ${{ secrets.STUDIO_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}
          # The whole history: the changed files come from a diff against base.
          fetch-depth: 0

      # #1093: every LFS object except the ~600 MB plugin tree, which no test
      # here reads (#974's NeuralAmpModelerCore archive included).
      # The studio and its private git dependencies: load their deploy keys
      # so git and cargo can fetch them (git CLI over SSH, CARGO_NET_GIT_FETCH_WITH_CLI).
      - name: Load the deploy keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEYS }}

      - name: Pull LFS objects except the plugin tree
        # Without the agent: ssh would offer a dependency's deploy key first, and
        # GitHub answers "Repository not found" for xgodev/jovee. checkout's own
        # key (core.sshCommand) is the one that reaches it.
        run: SSH_AUTH_SOCK= git lfs pull --exclude="plugins/source/**"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # #991: rust-cache keys on the members' manifests and Cargo.lock, not on
      # the root manifest, whose profiles and workspace features rebuild every
      # dependency when they change. Its RUST* env vars are part of the key.
      # The release version line is left out: it changes on every release.
      - name: Key the cache on the root manifest
        run: echo "RUST_CACHE_ROOT_MANIFEST=$(grep -v '^version = ' Cargo.toml | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      # #991: with no cache every run compiled 516 third-party crates (557
      # with the workspace) from scratch — ~12 of the job's ~20 minutes. Only
      # branch pushes save, so a PR run restores its base branch's cache
      # instead of adding its own to the repo's 10 GB quota. Workspace crates
      # are never cached. A failed run still saves: its dependencies built.
      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-debug
          # The key hashes the root manifest, so a release branch never hits
          # develop's cache: it saves its own or every run stays cold.
          save-if: ${{ inputs.ref == 'develop' || startsWith(inputs.ref, 'release/') }}
          cache-on-failure: true

      - name: Install system dependencies
        # A mirror that stops answering hangs apt silently; bound it.
        timeout-minutes: 10
        run: |
          APT="sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60"
          $APT update
          $APT install -y \
            libasound2-dev libudev-dev libdbus-1-dev pkg-config clang libclang-dev \
            libfontconfig1-dev libseat-dev \
            libxkbcommon-dev libinput-dev libgbm-dev \
            libjack-jackd2-dev gettext

      # The suite must be able to fail the job — no `|| true`. Tests that need
      # the owner's private capture tree (JOVEE_OWNER_PLUGINS) skip loudly
      # when it is absent; they never hard-fail CI. See issue #793.
      # A hard timeout keeps a hung test from wedging the runner for hours
      # (see issue #693 FIFO tests, fixed to never block the test thread).
      # nextest runs every test binary in parallel; it skips doctests, so
      # `cargo test --doc` runs them after. scripts/pre-pr-gate.sh runs the same.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # rig-gui's build.rs writes the .mo catalogs into translations/,
      # which slint-build watches. On a fresh checkout that write lands after
      # the build script started, so the next cargo call re-runs it and
      # recompiles rig-gui. Compiled here first, the .mo files are already
      # fresh and build.rs never writes them.
      - name: Compile the translation catalogs
        run: |
          for po in crates/rig-gui/translations/*/LC_MESSAGES/rig-gui.po; do
            msgfmt -o "${po%.po}.mo" "$po"
          done

      # The test selector (tools/ci-test-map of this repository).
      - name: Check out the test selector
        uses: actions/checkout@v4
        with:
          repository: xgodev/jovee-release
          path: .ci-tools

      - name: Build the test selector
        run: cargo build --release --manifest-path .ci-tools/tools/ci-test-map/Cargo.toml --target-dir .ci-tools/target

      # The newest test map (test-map.yml): which tests run each function.
      - name: Restore the test map
        uses: actions/cache/restore@v4
        with:
          path: test-map.json
          key: test-map-none
          restore-keys: test-map-

      - name: Run the tests of the changed lines
        timeout-minutes: 120
        env:
          # With all 4 cores the warm build starved the runner until GitHub
          # lost it ("The hosted runner lost communication").
          CARGO_BUILD_JOBS: 2
        run: |
          # Memory, swap and disk every 30 s. Below 10 GB free it prints what
          # holds the disk and stops cargo, so the log survives (a full disk
          # kills the runner and loses it).
          (while sleep 30; do
            echo "mem: $(free -m | awk 'NR>1{printf "%s used=%s free=%s; ", $1, $3, $4}') disk: $(df -h / | awk 'NR==2{print $4}') target: $(du -sh target 2>/dev/null | cut -f1)"
            if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 10 ]; then
              du -xh --max-depth=3 target 2>/dev/null | sort -rh | head -30
              pkill -9 cargo; pkill -9 rustc; break
            fi
          done) &
          # Only the tests that run a line changed between base and ref (from
          # the test map), the new tests of the changed crates, and every test
          # of a crate whose non-Rust file changed. A change outside any crate
          # that a build can read (Cargo.lock, assets...) tests everything;
          # docs, site, packaging and scripts test nothing. With no map: the
          # changed crates and the crates that depend on them.
          base="${{ inputs.base }}"
          [ -n "$base" ] || base=HEAD~1
          sel=.ci-tools/target/release/ci-test-map
          cargo metadata --format-version 1 > metadata.json
          $sel select --metadata metadata.json --base "$base" --map test-map.json --out selection
          if [ -z "$(cat selection/packages)" ]; then echo "no test runs a changed line"; exit 0; fi
          # Builds the test binaries of those crates and lists their tests.
          cargo nextest list $(cat selection/packages) --message-format json > list.json
          $sel select --metadata metadata.json --base "$base" --map test-map.json --list list.json --out selection
          echo "filter: $(head -c 2000 selection/filter)"
          failed=""
          # The e2e screen scenarios (e2e_ui) do not run in CI (the filter drops them).
          if [ -n "$(cat selection/filter)" ]; then
            cargo nextest run $(cat selection/packages) --no-fail-fast --no-tests=pass -E "$(cat selection/filter)" || failed="$failed tests"
          fi
          if [ -n "$(cat selection/doc-packages)" ]; then
            timeout --signal=SIGKILL 1200 cargo test $(cat selection/doc-packages) --doc || failed="$failed doctests"
          fi
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi

      - name: Disk left after the build
        if: always()
        run: df -h /

  # #974: after develop's own tests pass, move the vendored NeuralAmpModelerCore
  # to the newest upstream release. The new version is tested here, in its own
  # job, and pushed to develop only when the whole suite passes — a release
  # that breaks the build or the tests never lands, and this job goes red
  # naming it. Only develop: release branches take the new NAM when they are
  # cut from it, and a bot push there would leave the release→main PR head
  # with no checks (GITHUB_TOKEN pushes trigger no workflow). An unreachable
  # upstream or a refused push is a warning.
  nam-refresh:
    name: Refresh vendored NeuralAmpModelerCore
    needs: test
    if: inputs.ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xgodev/jovee
          ssh-key: ${{ secrets.STUDIO_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}

      # #1093: every LFS object except the ~600 MB plugin tree, which no test
      # here reads (#974's NeuralAmpModelerCore archive included).
      # The studio and its private git dependencies: load their deploy keys
      # so git and cargo can fetch them (git CLI over SSH, CARGO_NET_GIT_FETCH_WITH_CLI).
      - name: Load the deploy keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEYS }}

      - name: Pull LFS objects except the plugin tree
        # Without the agent: ssh would offer a dependency's deploy key first, and
        # GitHub answers "Repository not found" for xgodev/jovee. checkout's own
        # key (core.sshCommand) is the one that reaches it.
        run: SSH_AUTH_SOCK= git lfs pull --exclude="plugins/source/**"

      - name: Vendor the newest upstream release
        id: vendor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/nam_vendor.py update
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        if: steps.vendor.outputs.bumped == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Key the cache on the root manifest
        if: steps.vendor.outputs.bumped == 'true'
        run: echo "RUST_CACHE_ROOT_MANIFEST=$(grep -v '^version = ' Cargo.toml | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      # #991: same debug build as the Test Suite, so it reads that job's cache.
      - name: Restore the Test Suite's dependency cache
        if: steps.vendor.outputs.bumped == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-debug-0
          save-if: false

      - name: Install system dependencies
        if: steps.vendor.outputs.bumped == 'true'
        # A mirror that stops answering hangs apt silently; bound it.
        timeout-minutes: 10
        run: |
          APT="sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60"
          $APT update
          $APT install -y \
            libasound2-dev libudev-dev libdbus-1-dev pkg-config clang libclang-dev \
            libfontconfig1-dev libseat-dev \
            libxkbcommon-dev libinput-dev libgbm-dev \
            libjack-jackd2-dev gettext

      # #1118: each crate's integration tests share one binary; nextest keeps
      # every test in its own process (process-global state stays per test).
      - name: Install cargo-nextest
        if: steps.vendor.outputs.bumped == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test the new release
        if: steps.vendor.outputs.bumped == 'true'
        run: |
          timeout --signal=SIGKILL 1500 cargo nextest run --workspace --no-fail-fast
          timeout --signal=SIGKILL 600 cargo test --workspace --doc

      - name: Push it to develop
        if: steps.vendor.outputs.bumped == 'true'
        run: python3 scripts/nam_vendor.py push

  # Coverage is REPORTING, not a gate. It lives in its own job with
  # continue-on-error so it can NEVER block a PR whose tests passed: the
  # `cargo llvm-cov` instrumented rebuild + full re-run of this large
  # audio/Slint workspace is heavy enough to exhaust an ubuntu runner (OOM /
  # disk), and a killed runner ignores an inline `|| true`. Isolating it keeps
  # the Test Suite result about tests only. See issue #793.
  coverage:
    name: Coverage (${{ matrix.shard }}/4)
    # Only on request (-f coverage=true): the instrumented build recompiles
    # the whole workspace with no cache, and the run ends only when it does.
    if: inputs.coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    # The instrumented test binaries of the whole workspace filled the runner's
    # disk ("No space left on device") and no report came out. Four runners
    # each cover every fourth crate, like the Test Suite; Codecov merges the
    # four uploads of a commit.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    # Reporting only: never hold a runner longer than a full instrumented run.
    timeout-minutes: 120
    steps:
      # The instrumented rebuild fills the runner's disk the same way the
      # Test Suite build does; drop the same unused toolchains first.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      # The workspace build peaks above the runner's RAM while it compiles and
      # links the adapter crates; the runner then loses the job (exit 137/143,
      # "lost communication with the server"). A swap file on the freed disk
      # absorbs the peak instead of killing the job.
      - name: Add swap for the build peak
        run: |
          sudo swapoff -a
          # 4 GB: the build peaked at ~8.4 GB RAM and <1 GB swap, and every GB
          # here is a GB the target dir cannot use ("No space left on device").
          sudo fallocate -l 4G /ci-swapfile
          sudo chmod 600 /ci-swapfile
          sudo mkswap /ci-swapfile
          sudo swapon /ci-swapfile
          free -h

      - uses: actions/checkout@v4
        with:
          repository: xgodev/jovee
          ssh-key: ${{ secrets.STUDIO_DEPLOY_KEY }}
          ref: ${{ inputs.ref }}

      # #1093: every LFS object except the ~600 MB plugin tree, which no test
      # here reads (#974's NeuralAmpModelerCore archive included).
      # The studio and its private git dependencies: load their deploy keys
      # so git and cargo can fetch them (git CLI over SSH, CARGO_NET_GIT_FETCH_WITH_CLI).
      - name: Load the deploy keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEYS }}

      - name: Pull LFS objects except the plugin tree
        # Without the agent: ssh would offer a dependency's deploy key first, and
        # GitHub answers "Repository not found" for xgodev/jovee. checkout's own
        # key (core.sshCommand) is the one that reaches it.
        run: SSH_AUTH_SOCK= git lfs pull --exclude="plugins/source/**"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Key the cache on the root manifest
        run: echo "RUST_CACHE_ROOT_MANIFEST=$(grep -v '^version = ' Cargo.toml | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      # #991: the instrumented build has its own cache (separate
      # target/llvm-cov-target); same save rules as the Test Suite. Saving on
      # failure matters here: a cold run can hit the 30-min step limit after
      # its dependencies are built, and without it the next run is cold again.
      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-instrumented-${{ matrix.shard }}
          # Never saved: GitHub keeps 10 GB of cache per repo and the four
          # Test Suite caches take 2.5 GB each. Coverage caches evicted them,
          # and the evicted shard compiled every dependency again.
          save-if: false
          cache-on-failure: true

      - name: Install system dependencies
        # A mirror that stops answering hangs apt silently; bound it.
        timeout-minutes: 10
        run: |
          APT="sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60"
          $APT update
          $APT install -y \
            libasound2-dev libudev-dev libdbus-1-dev pkg-config clang libclang-dev \
            libfontconfig1-dev libseat-dev \
            libxkbcommon-dev libinput-dev libgbm-dev \
            libjack-jackd2-dev gettext

      # #991: prebuilt binary; `cargo install` compiled it from source (~1 min).
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # #1118: each crate's integration tests share one binary; nextest keeps
      # every test in its own process, as the Test Suite runs them.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Generate coverage report
        timeout-minutes: 100
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          # Memory and disk every 30 s; below 10 GB free it prints what holds
          # the disk and stops cargo, so the log says why (a full disk kills
          # the runner and loses it).
          (while sleep 30; do
            echo "mem: $(free -m | awk 'NR>1{printf "%s used=%s free=%s; ", $1, $3, $4}') disk: $(df -h / | awk 'NR==2{print $4}') target: $(du -sh target 2>/dev/null | cut -f1)"
            if [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -lt 10 ]; then
              du -xh --max-depth=3 target 2>/dev/null | sort -rh | head -30
              pkill -9 cargo; pkill -9 rustc; break
            fi
          done) &
          pkgs=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | sort | awk -v s=${{ matrix.shard }} '(NR-1)%4==s' | sed 's/^/-p /' | tr '\n' ' ')
          # A failing test is the Test Suite's business: the report still
          # comes out. Anything else (build error, full disk) fails the step.
          cargo llvm-cov nextest $pkgs --ignore-run-fail --no-tests=pass \
            -E 'not test(/e2e_ui/)' --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-coverage-${{ matrix.shard }}
          path: lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always() && hashFiles('lcov.info') != ''
        with:
          files: lcov.info
          flags: shard-${{ matrix.shard }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
